<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>노인복지론 퀴즈</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
<style>
    :root {
        --primary: #b45309;
        --bg-gray: #f4f6f8;
        --success: #28a745;
        --danger: #dc3545;
    }
    body { font-family: 'Pretendard', sans-serif; background-color: var(--bg-gray); margin: 0; padding: 20px; display: flex; justify-content: center; min-height: 100vh; }
    .container { width: 100%; max-width: 700px; }
    .header { text-align: center; margin-bottom: 20px; }
    .header h1 { font-size: 1.8rem; color: #14213d; font-weight: 800; margin-bottom: 10px; word-break: keep-all; }
    .header p { color: #55657d; font-weight: bold; font-size: 1.1rem; margin: 0; }
    .header .score-text { margin-top: 6px; color: #166534; font-size: 1rem; }

    .quiz-box { background: white; border-radius: 15px; padding: 30px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    .q-type { display: inline-block; background: #e0e7f1; color: #14213d; padding: 4px 12px; border-radius: 20px; font-size: 0.85rem; margin-bottom: 15px; font-weight: 700; }
    #question-text { font-weight: bold; font-size: 1.2rem; margin-bottom: 25px; word-break: keep-all; line-height: 1.4; color: #14213d; }

    .option-btn { width: 100%; text-align: left; padding: 16px; margin: 10px 0; border: 1.5px solid #e0e7f1; border-radius: 10px; background: white; cursor: pointer; font-size: 1.05rem; transition: 0.2s; line-height: 1.4; color: #2f3640; font-weight: 500; font-family: inherit; }
    .option-btn:hover { background: #fff7ed; border-color: var(--primary); }
    .option-btn:focus-visible, .btn-next:focus-visible, .result-btn:focus-visible { outline: 3px solid #14213d; outline-offset: 2px; }
    .option-btn.correct { background: #e6fffa; border-color: var(--success); color: var(--success); font-weight: bold; }
    .option-btn.wrong { background: #fff5f5; border-color: var(--danger); color: var(--danger); opacity: 0.6; }

    .btn-next { width: 100%; padding: 16px; border-radius: 10px; border: none; background: var(--primary); color: white; font-weight: bold; cursor: pointer; margin-top: 25px; display: none; font-size: 1.1rem; transition: 0.2s; font-family: inherit; }
    .btn-next:hover { opacity: 0.9; transform: translateY(-2px); }

    .hint-box, .exp-box { padding: 18px; border-radius: 10px; margin-top: 15px; display: none; line-height: 1.6; word-break: keep-all; font-size: 0.95rem; }
    .hint-box { background: #fffbeb; border: 1px solid #fbd38d; color: #b45309; }
    .exp-box { background: #f0fdf4; border: 1px solid #bbf7d0; color: #065f46; }

    .result-card { background: white; border-radius: 20px; padding: 40px; text-align: center; display: none; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
    .result-btn { width: 100%; padding: 16px; margin: 10px 0; border: 1.5px solid #e0e7f1; border-radius: 10px; background: white; cursor: pointer; font-size: 1.05rem; font-weight: bold; transition: 0.2s; font-family: inherit; }
    .result-btn:hover { background: #f3f6fa; }
    .result-score { margin: 6px 0 4px; font-size: 3.4rem; font-weight: 800; color: var(--primary); line-height: 1.1; }
    .result-detail { margin: 0 0 10px; color: #55657d; line-height: 1.6; word-break: keep-all; }
    #result-msg { margin: 0 0 18px; line-height: 1.6; word-break: keep-all; color: #14213d; font-weight: 600; }
    .missed { text-align: left; margin: 0 0 18px; padding: 10px 16px; border: 1px solid #e0e7f1; border-radius: 10px; }
    .missed summary { cursor: pointer; font-weight: 700; color: #14213d; padding: 4px 0; }
    .missed ol { margin: 10px 0 4px; padding-left: 26px; font-size: 0.95rem; line-height: 1.55; word-break: keep-all; color: #2f3640; }
    .missed li { margin-bottom: 8px; }

    /* 문제 화면 아래의 목록으로 돌아가기 버튼 */
    .list-btn { width: 100%; padding: 14px; margin-top: 16px; border: 1.5px solid #cbd5e1; border-radius: 10px; background: white; color: #14213d; font-family: inherit; font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .list-btn:hover { background: #f3f6fa; }
    .list-btn:focus-visible { outline: 3px solid #14213d; outline-offset: 2px; }

    /* 데이터 검사 결과 화면 */
    .problem-card { display: none; background: white; border-radius: 15px; padding: 28px; border-left: 6px solid var(--danger); box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    .problem-card h2 { margin: 0 0 8px; font-size: 1.3rem; color: #14213d; }
    .problem-card .summary { margin: 0 0 16px; color: #55657d; line-height: 1.6; word-break: keep-all; }
    .problem-list { list-style: none; margin: 0 0 8px; padding: 0; }
    .problem-list li { display: flex; gap: 10px; padding: 10px 0; border-top: 1px solid #e0e7f1; line-height: 1.5; word-break: keep-all; }
    .problem-list .tag { flex: none; min-width: 3.2rem; font-weight: 800; color: var(--danger); }
    .problem-list .warn .tag { color: var(--primary); }
    .problem-card .tips { margin: 12px 0 0; padding: 14px; background: #f3f6fa; border-radius: 10px; font-size: 0.92rem; line-height: 1.6; color: #2f3640; word-break: keep-all; }
    .problem-card .tips ul { margin: 6px 0 0; padding-left: 20px; }
    #partial-btn { width: 100%; padding: 16px; margin-top: 16px; border: none; border-radius: 10px; background: var(--primary); color: white; font-weight: bold; font-size: 1.05rem; cursor: pointer; font-family: inherit; }
    #partial-btn:focus-visible { outline: 3px solid #14213d; outline-offset: 2px; }
</style>
</head>
<body>
<div class="container">
    <div id="problem-screen" class="problem-card" role="alert">
        <h2 id="problem-title"></h2>
        <p id="problem-summary" class="summary"></p>
        <ul id="problem-list" class="problem-list"></ul>
        <div id="problem-tips" class="tips"></div>
        <button id="partial-btn" type="button"></button>
    </div>

    <div id="quiz-screen">
        <div class="header">
            <h1 id="lecture-title"></h1>
            <p id="progress-text"></p>
            <p id="score-text" class="score-text"></p>
        </div>
        <div class="quiz-box">
            <div id="question-type" class="q-type">개념확인</div>
            <div id="question-text"></div>
            <div id="options-container"></div>

            <div id="hint-box" class="hint-box">💡 <b>힌트:</b> <span id="hint-text"></span></div>
            <div id="exp-box" class="exp-box">✅ <b>정답 및 해설:</b> <span id="exp-text"></span></div>

            <button id="next-btn" class="btn-next" type="button" onclick="nextQuestion()">다음 문제로</button>
        </div>

        <button class="list-btn" type="button" onclick="goList()">🏠 목록으로 돌아가기</button>
    </div>

    <div id="result-screen" class="result-card">
        <h2 id="result-title">🎊 학습을 마쳤습니다!</h2>
        <p id="result-score" class="result-score"></p>
        <p id="result-detail" class="result-detail"></p>
        <p id="result-msg"></p>
        <details id="missed-details" class="missed">
            <summary id="missed-summary"></summary>
            <ol id="missed-list"></ol>
        </details>
        <button id="retry-missed-btn" class="result-btn" type="button" style="background:var(--primary); color:white; border:none;" onclick="retryMissed()"></button>
        <button class="result-btn" type="button" onclick="retryAll()">🔄 처음부터 다시 풀기</button>
        <button class="result-btn" type="button" onclick="location.href='index.html'">🏠 목록으로 돌아가기</button>
    </div>
</div>

<!-- ① 오류 수집용: 반드시 맨 위(②, ③보다 앞)에 두세요. 수정하지 마세요. -->
<script>
    window.__dataErrors = [];
    window.addEventListener('error', function (e) {
        window.__dataErrors.push({ msg: e.message, line: e.lineno });
    });
</script>

            var problems = [];

            if (!item || typeof item !== 'object') {
                problems.push('문제가 { } 형식이 아닙니다.');
            } else {
                if (typeof item.q !== 'string' || !item.q.trim()) {
                    problems.push('q(질문)가 없거나 비어 있습니다.');
                }

                var oOk = Array.isArray(item.o);
                if (!oOk) {
                    problems.push('o(보기)가 배열([ ])이 아닙니다.');
                } else {
                    if (item.o.length < 2) {
                        problems.push('보기가 ' + item.o.length + '개뿐입니다. 2개 이상 필요합니다.');
                    }
                    var bad = item.o.some(function (x) { return typeof x !== 'string' || !x.trim(); });
                    if (bad) {
                        problems.push('보기 중에 비어 있거나 글자가 아닌 항목이 있습니다.');
                    } else {
                        var uniq = {};
                        item.o.forEach(function (x) { uniq[x.trim()] = true; });
                        if (Object.keys(uniq).length !== item.o.length) {
                            problems.push('똑같은 보기가 2개 이상 있습니다.');
                        }
                    }
                }

                if (typeof item.a === 'string') {
                    problems.push('a(정답 번호)가 따옴표로 감싸져 있습니다("' + item.a + '"). 따옴표 없는 숫자로 바꾸세요.');
                } else if (!Number.isInteger(item.a)) {
                    problems.push('a(정답 번호)가 없거나 숫자가 아닙니다.');
                } else if (oOk && (item.a < 0 || item.a >= item.o.length)) {
                    if (item.a === item.o.length) {
                        problems.push('a가 ' + item.a + '입니다. 번호는 0부터 세므로 보기가 ' + item.o.length + '개면 0~' + (item.o.length - 1) + ' 중 하나여야 합니다. 1부터 센 것 같아요(' + item.a + ' → ' + (item.a - 1) + ').');
                    } else {
                        problems.push('a가 ' + item.a + '로 보기 범위(0~' + (item.o.length - 1) + ')를 벗어났습니다.');
                    }
                }

                if (typeof item.h !== 'string' || !item.h.trim()) {
                    problems.push('h(힌트)가 없거나 비어 있습니다.');
                }
                if (typeof item.e !== 'string' || !item.e.trim()) {
                    problems.push('e(해설)가 없거나 비어 있습니다.');
                }
            }

            if (problems.length) {
                problems.forEach(function (t) { errors.push({ tag: tag, text: t }); });
            } else {
                valid.push(item);
            }
        });

        

        return { errors: errors, warnings: warnings, valid: valid };
    }

    /* ---------- 검사 결과 화면 ---------- */
    function showProblemScreen(opts) {
        document.getElementById('quiz-screen').style.display = 'none';
        document.getElementById('problem-screen').style.display = 'block';
        document.getElementById('problem-title').textContent = opts.title;
        document.getElementById('problem-summary').textContent = opts.summary;

        var list = document.getElementById('problem-list');
        list.innerHTML = '';
        opts.items.forEach(function (it) {
            var li = document.createElement('li');
            if (it.warn) li.className = 'warn';
            var tag = document.createElement('span');
            tag.className = 'tag';
            tag.textContent = it.tag;
            var txt = document.createElement('span');
            txt.textContent = it.text;
            li.appendChild(tag);
            li.appendChild(txt);
            list.appendChild(li);
        });

        var tips = document.getElementById('problem-tips');
        tips.innerHTML = '';
        if (opts.tips && opts.tips.length) {
            tips.appendChild(document.createTextNode('자주 생기는 원인'));
            var ul = document.createElement('ul');
            opts.tips.forEach(function (t) {
                var li = document.createElement('li');
                li.textContent = t;
                ul.appendChild(li);
            });
            tips.appendChild(ul);
            tips.style.display = 'block';
        } else {
            tips.style.display = 'none';
        }

        var btn = document.getElementById('partial-btn');
        if (opts.buttonText) {
            btn.textContent = opts.buttonText;
            btn.style.display = 'block';
            btn.onclick = opts.onButton;
        } else {
            btn.style.display = 'none';
        }
    }

    function startQuiz(list) {
        allQuestions = list;
        document.getElementById('problem-screen').style.display = 'none';
        beginRound(list);
    }

    // 한 회차 시작: 전체 문제 또는 틀린 문제만 받아서 처음부터 진행
    function beginRound(list) {
        questions = list;
        curIdx = 0;
        correctFirst = 0;
        missed = [];
        document.getElementById('result-screen').style.display = 'none';
        document.getElementById('quiz-screen').style.display = 'block';
        loadQuestion();
    }

    function init() {
        // 데이터 문법 오류: ③ 블록이 아예 실행되지 못한 경우
        if (typeof quizData === 'undefined') {
            var items = window.__dataErrors.map(function (er) {
                return { tag: er.line ? ('약 ' + er.line + '줄') : '오류', text: er.msg };
            });
            if (!items.length) items.push({ tag: '오류', text: 'quizData를 찾을 수 없습니다. const quizData = [ ... ]; 형태가 맞는지 확인하세요.' });
            showProblemScreen({
                title: '⚠️ 퀴즈 데이터를 읽지 못했어요',
                summary: '데이터 부분에 문법 오류가 있어서 프로그램이 멈췄습니다. 아래 줄 근처를 확인하세요.',
                items: items,
                tips: [
                    '문장 안에 큰따옴표(")가 들어 있음 → 작은따옴표(\')로 바꾸기',
                    '문제와 문제 사이 쉼표(,) 빠짐, 또는 맨 끝의 ]; 가 지워짐',
                    '문장 한가운데에서 줄이 바뀜 (한 문장은 한 줄로)',
                    '붙여넣은 글에 // 가 포함되어 뒷부분이 주석 처리됨'
                ]
            });
            return;
        }

        var result = validateQuizData(quizData);

        if (result.errors.length === 0 && result.warnings.length === 0) {
            startQuiz(result.valid);
            return;
        }

        var items = result.errors.map(function (er) { return { tag: er.tag, text: er.text }; })
            .concat(result.warnings.map(function (w) { return { tag: w.tag, text: w.text, warn: true }; }));

        var badCount = (Array.isArray(quizData) ? quizData.length : 0) - result.valid.length;
        var hasErrors = result.errors.length > 0;

        showProblemScreen({
            title: hasErrors ? '⚠️ 고칠 곳이 ' + result.errors.length + '군데 있어요' : '확인해 볼 곳이 있어요',
            summary: !hasErrors
                ? '오류는 아니지만 한 번 확인해 보세요.'
                : (badCount > 0
                    ? '전체 ' + quizData.length + '문제 중 ' + badCount + '문제에 문제가 있습니다. 데이터를 고치고 새로고침하세요.'
                    : '퀴즈 데이터를 확인하고 새로고침하세요.'),
            items: items,
            tips: hasErrors ? [
                '정답 번호 a는 따옴표 없는 숫자이고, 첫 번째 보기가 0입니다',
                '문제마다 type, q, o, a, h, e 가 모두 있어야 합니다'
            ] : null,
            buttonText: result.valid.length > 0
                ? (hasErrors ? '오류 없는 ' + result.valid.length + '문제만 먼저 풀기' : '그대로 시작하기')
                : null,
            onButton: function () { startQuiz(result.valid); }
        });
    }

    /* ---------- 퀴즈 진행 ---------- */
    function loadQuestion() {
        wrongCount = 0;
        var q = questions[curIdx];

        document.getElementById('progress-text').textContent = (curIdx + 1) + ' / ' + questions.length;
        updateScore();
        window.scrollTo(0, 0);
        document.getElementById('question-type').textContent = q.type || '일반문제';
        document.getElementById('question-text').textContent = 'Q' + (allQuestions.indexOf(q) + 1) + '. ' + q.q;

        var container = document.getElementById('options-container');
        container.innerHTML = '';
        q.o.forEach(function (opt, idx) {
            var btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'option-btn';
            btn.textContent = opt;
            btn.onclick = function () { checkAnswer(idx, btn); };
            container.appendChild(btn);
        });

        document.getElementById('hint-box').style.display = 'none';
        document.getElementById('exp-box').style.display = 'none';
        document.getElementById('next-btn').style.display = 'none';
    }

    function checkAnswer(idx, btn) {
        var q = questions[curIdx];
        var allBtns = document.querySelectorAll('.option-btn');

        if (idx === q.a) {
            btn.classList.add('correct');
            allBtns.forEach(function (b) { b.style.pointerEvents = 'none'; });
            if (wrongCount === 0) { correctFirst++; updateScore(); }
            showExplanation();
        } else {
            wrongCount++;
            if (wrongCount === 1) missed.push(q);
            btn.classList.add('wrong');
            btn.style.pointerEvents = 'none';

            if (wrongCount === 1) {
                document.getElementById('hint-text').textContent = q.h;
                document.getElementById('hint-box').style.display = 'block';
            } else {
                allBtns[q.a].classList.add('correct');
                allBtns.forEach(function (b) { b.style.pointerEvents = 'none'; });
                showExplanation();
            }
        }
    }

    function showExplanation() {
        var q = questions[curIdx];
        document.getElementById('exp-text').textContent = q.e;
        document.getElementById('exp-box').style.display = 'block';
        document.getElementById('next-btn').style.display = 'block';
    }

    // 풀던 중에 누르면 한 번 물어봅니다. (묻지 않으려면 if 문 세 줄을 지우세요)
    function goList() {
        if (curIdx > 0 && !confirm('퀴즈를 그만하고 목록으로 갈까요?\n지금까지 푼 기록은 저장되지 않아요.')) return;
        location.href = 'index.html';
    }

    function nextQuestion() {
        curIdx++;
        if (curIdx < questions.length) {
            loadQuestion();
        } else {
            showResult();
        }
    }

    /* ---------- 점수와 다시 풀기 ---------- */
    // 한 번에 맞힌 문제만 점수로 셉니다. (힌트를 본 뒤 맞히면 점수에 넣지 않아요)
    function updateScore() {
        document.getElementById('score-text').textContent = '한 번에 맞힌 문제 ' + correctFirst + '개';
    }

    function showResult() {
        var total = questions.length;
        var score = Math.round(correctFirst / total * 100);
        var isRetry = total < allQuestions.length;

        document.getElementById('quiz-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';

        document.getElementById('result-title').textContent = isRetry ? '🔁 틀린 문제 복습을 마쳤습니다!' : '🎊 학습을 마쳤습니다!';
        document.getElementById('result-score').textContent = score + '점';
        document.getElementById('result-detail').textContent =
            (isRetry ? '복습한 ' : '전체 ') + total + '문제 중 한 번에 맞힌 문제 ' + correctFirst + '개 (100점 만점)';

        var msg;
        if (score >= 90) msg = '진짜 수고 많이 하셨습니다, 학우님! A+ 당근 🥕';
        else if (score >= 70) msg = '잘하고 계세요! 틀린 문제만 한 번 더 풀면 더 단단해져요.';
        else msg = '괜찮아요. 틀린 문제를 해설과 함께 다시 풀어 보면 금방 늘어요.';
        document.getElementById('result-msg').textContent = msg;

        var details = document.getElementById('missed-details');
        var list = document.getElementById('missed-list');
        list.innerHTML = '';
        missed.forEach(function (m) {
            var li = document.createElement('li');
            li.value = allQuestions.indexOf(m) + 1;
            li.textContent = m.q;
            list.appendChild(li);
        });
        details.open = false;
        details.style.display = missed.length ? 'block' : 'none';
        document.getElementById('missed-summary').textContent = '이번에 틀린 문제 ' + missed.length + '개 보기';

        var retryBtn = document.getElementById('retry-missed-btn');
        retryBtn.textContent = '❌ 틀린 문제만 다시 풀기 (' + missed.length + '문제)';
        retryBtn.style.display = missed.length ? 'block' : 'none';

        window.scrollTo(0, 0);
    }

    function retryAll() { beginRound(allQuestions); }
    function retryMissed() { if (missed.length) beginRound(missed.slice()); }

    init();
</script>
