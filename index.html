<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>노인복지론 학습장</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
<style>
    :root {
        --ink: #14213d;
        --muted: #55657d;
        --paper: #f3f6fa;
        --rule: #d5deea;
        --c-card: #1f6b46;
        --c-quiz: #b45309;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
        margin: 0;
        font-family: 'Pretendard', -apple-system, 'Noto Sans KR', sans-serif;
        background: var(--paper);
        color: var(--ink);
        line-height: 1.5;
        word-break: keep-all;
    }
    .wrap { max-width: 960px; margin: 0 auto; padding: 0 24px; }

    /* 머리말 */
    .hero { padding: 56px 0 8px; }
    h1 {
        margin: 0 0 16px;
        font-size: clamp(2.1rem, 6vw, 3.6rem);
        font-weight: 800;
        letter-spacing: -0.03em;
        line-height: 1.15;
    }
    .lead { margin: 0; color: var(--muted); font-size: 1.1rem; max-width: 26em; }

    /* 장 목록 */
    .part { margin-top: 40px; }
    .part-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        padding-bottom: 8px;
        border-bottom: 2px solid var(--ink);
    }
    .part-head h2 { margin: 0; font-size: 1.35rem; font-weight: 800; letter-spacing: -0.01em; }
    .part-head .range { color: var(--muted); font-size: 0.95rem; }
    .list { list-style: none; margin: 0; padding: 0; }
    .lec {
        display: grid;
        grid-template-columns: 3rem 1fr auto;
        gap: 6px 12px;
        align-items: center;
        padding: 14px 8px;
        border-bottom: 1px solid var(--rule);
    }
    .lec:hover { background: #fff; }
    .n { font-variant-numeric: tabular-nums; font-weight: 800; font-size: 1.05rem; color: var(--muted); }
    .t { margin: 0; font-size: 1.08rem; font-weight: 650; }
    .acts { display: flex; flex-wrap: wrap; gap: 8px; }
    .a {
        display: inline-flex;
        align-items: center;
        min-height: 40px;
        padding: 0 14px;
        border: 1.5px solid var(--c);
        border-radius: 8px;
        color: var(--c);
        font-size: 0.92rem;
        font-weight: 700;
        text-decoration: none;
        transition: background .15s, color .15s;
    }
    .a:hover { background: var(--c); color: #fff; }
    .a:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
    .a.card { --c: var(--c-card); }
    .a.quiz { --c: var(--c-quiz); }

    footer { margin-top: 56px; padding-top: 24px; padding-bottom: 56px; border-top: 1px solid var(--rule); color: var(--muted); }
    footer .motto { margin: 0 0 6px; color: var(--ink); font-size: 1.3rem; font-weight: 800; }
    footer .sub { margin: 0 0 14px; color: var(--muted); font-size: 1.05rem; font-weight: 600; }
    footer .credit { margin: 0; font-size: 0.92rem; }

    @media (max-width: 680px) {
        .wrap { padding: 0 18px; }
        .hero { padding: 36px 0 4px; }
        .lec { grid-template-columns: 2.4rem 1fr; padding: 14px 4px; }
        .acts { grid-column: 2; }
    }
    @media (prefers-reduced-motion: reduce) {
        .a { transition: none; }
    }
</style>
</head>
<body>

<header class="hero">
    <div class="wrap">
        <h1>노인복지론 학습</h1>
        <p class="lead">노인복지론 학습을 향한 15단계 여정</p>
    </div>
</header>

<main class="wrap" id="parts"></main>

<footer class="wrap">
    <p class="motto">"나이 듦을 배우면, 삶이 보인다"</p>
    <p class="sub">오늘의 목표: 15장 완주</p>
    <p class="credit">만든이: 유승욱 (다른 곳에 공유하기 없기!)<br>도우미: 클로드, 쳇지피티, 제미나이, 노트북 L.M., 젠스파크</p>
</footer>

<script>
    // 장 번호(1~15) 순서대로 제목을 적었습니다. 바꾸고 싶으면 글자만 고치세요.
    const chapters = {
         1: "노인에 대한 이해",
         2: "노화 관련 이론",
         3: "노인과 가족",
         4: "노인문제",
         5: "노년기 여가활동과 노인교육",
         6: "노인복지정책의 이해",
         7: "노인소득보장정책",
         8: "노인의료보장정책",
         9: "노인장기요양보험제도",
        10: "노인주거보장정책",
        11: "노인복지서비스",
        12: "노인복지실천",
        13: "노인상담",
        14: "고령친화산업",
        15: "베이비붐 세대와 새로운 대응"
    };

    // 파일 이름 앞부분: elderly_welfare_card_01.html, elderly_welfare_quiz_01.html 형태
    const prefix = "elderly_welfare";

    const root = document.getElementById('parts');

    const section = document.createElement('section');
    section.className = 'part';
    section.innerHTML = `<div class="part-head"><h2>노인복지론</h2><span class="range">1~15장</span></div>`;

    const list = document.createElement('ol');
    list.className = 'list';

    for (let n = 1; n <= 15; n++) {
        const f = String(n).padStart(2, '0');
        const li = document.createElement('li');
        li.className = 'lec';
        li.innerHTML =
            `<span class="n">${f}</span>` +
            `<h3 class="t">${chapters[n]}</h3>` +
            `<div class="acts">` +
                `<a class="a card" href="${prefix}_card_${f}.html">플래시카드</a>` +
                `<a class="a quiz" href="${prefix}_quiz_${f}.html">퀴즈 풀기</a>` +
            `</div>`;
        list.appendChild(li);
    }

    section.appendChild(list);
    root.appendChild(section);
</script>
</body>
</html>
